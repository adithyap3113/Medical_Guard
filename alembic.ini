# Alembic configuration.
#
# Note what is *not* here: `sqlalchemy.url`. The database URL is deliberately absent so
# that it cannot drift from the one the application uses. `migrations/env.py` reads it
# from `medguard.config.get_settings()`, which means `DATABASE_URL` in the environment
# governs both the app and its migrations, and there is no second place to update when
# switching between SQLite and PostgreSQL.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Migration filenames are timestamp-prefixed so `ls` shows them in creation order.
# Alembic's default (bare revision hash) sorts by nothing useful.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
