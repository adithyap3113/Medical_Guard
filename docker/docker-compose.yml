# MedGuard local infrastructure.
#
#   docker compose -f docker/docker-compose.yml up -d          # Qdrant only (default)
#   docker compose -f docker/docker-compose.yml --profile postgres up -d
#
# Only Qdrant starts by default. Everything else is behind a profile, because this
# development machine has roughly 2.5 GB of headroom and an unused Postgres container
# spends ~150 MB of it for nothing.
#
# Deliberately NOT here: self-hosted Langfuse. Langfuse v3+ requires Postgres +
# ClickHouse + Redis + MinIO, around 3-4 GB of RAM, which would make this machine
# unusable for development. Langfuse Cloud's free tier is used instead, and tracing
# degrades to a no-op when it is not configured.

name: medguard

services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: medguard-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      # Qdrant's image ships no curl or wget, so probe the port from the shell
      # instead of assuming an HTTP client exists.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # Bounded so an unexpectedly large ingestion cannot exhaust host memory.
          memory: 1G

  # Opt-in: `--profile postgres`. SQLite is the default relational store and needs
  # none of this. Enable when you want to exercise the deployment configuration.
  postgres:
    image: postgres:17-alpine
    container_name: medguard-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medguard
      # Local development credentials only. Never reuse these anywhere real.
      POSTGRES_PASSWORD: medguard
      POSTGRES_DB: medguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medguard -d medguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  qdrant_storage:
  postgres_data:
