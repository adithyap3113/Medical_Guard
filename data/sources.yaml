# MedGuard corpus definition.
#
# This file is the corpus. `medguard corpus download` reads it; nothing about the
# document list lives in Python. Editing the corpus is a data change, not a code change.
#
# Rules for adding an entry:
#   * The URL must have been fetched and confirmed to return `%PDF-` magic bytes.
#     Several publishers serve an HTML consent or WAF page under a .pdf URL with HTTP
#     200; content-type alone is not proof.
#   * title, publication_date and license_or_usage_note must come from the publisher,
#     not from memory. A field the publisher does not state is `null` -- and the reason
#     is recorded in data/raw/SOURCES.md.
#   * document_type is never a guess. The corpus is deliberately guideline-shaped.
#
# Every URL below was verified reachable on 2026-08-13. See data/raw/SOURCES.md for the
# sources that were tried and rejected, and why.

schema_version: 1

documents:
