  # ---------------------------------------------------------------------------
  # NIH -- National Heart, Lung, and Blood Institute (NHLBI).
  #
  # Admitted in Phase 3A, having been REJECTED in Phase 2. Nothing about the evidence
  # changed; the trade did. Phase 2 excluded these because NHLBI publishes no
  # document-specific usage terms on any reachable page (nhlbi.nih.gov/copyright,
  # /policies and /about/policies-and-notices all 404; nih.gov/web-policies-notices
  # returns 403), and attaching NLM's statement -- a different institute's page --
  # would have recorded a licence the source never issued.
  #
  # Phase 3A accepts a corpus of one publisher as the larger problem: 13 of 14
  # documents from CDC means "which publisher does this claim come from?" has one
  # answer, and no retrieval behaviour that depends on provenance can be demonstrated.
  # The resolution is not to invent terms. license_or_usage_note below states exactly
  # what is known and no more, which is honest under "never invent metadata" in a way
  # that borrowing NLM's text would not have been.
  #
  # publication_date is null for all three: NHLBI's landing pages state a year (2014,
  # 2012, 2007), never a full date, and a year is not a publication date. Reading one
  # off the title page needs a PDF parser -- Phase 3B.
  #
  # Titles are quoted from each document's NHLBI landing page, verified 2026-08-13.
  # ---------------------------------------------------------------------------

  - document_id: nhlbi_sickle_cell_2014
    title: "Evidence-Based Management of Sickle Cell Disease: Expert Panel Report, 2014"
    source_url: https://www.nhlbi.nih.gov/sites/default/files/media/docs/sickle-cell-disease-report%20020816_0.pdf
    source_organization: NIH
    document_type: guideline
    publication_date: null
    version_or_revision: Expert Panel Report, 2014
    local_filename: nhlbi_sickle_cell_2014.pdf
    license_or_usage_note: >-
      NIH-authored publication; specific reuse terms not published. NHLBI states no
      document-specific usage terms on this document's landing page, and no reachable
      NHLBI policy page states any. Recorded as unstated rather than assumed: US
      Government works are generally public domain, but that is an inference about the
      publisher, not a term this publisher published.
    notes: >-
      The landing page states the year 2014 (published September 2014) but no full
      date, so publication_date is null. Phase 3B may be able to read one off the
      title page.

