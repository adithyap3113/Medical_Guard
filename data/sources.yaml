  # ---------------------------------------------------------------------------
  # Retired entries.
  #
  # Kept, not deleted: dropping the entry would leave the document with no provenance
  # record at all, and -- where the file is still on disk -- make `corpus verify` report
  # an orphan forever. `retired: true` means "do not attempt to download", not "never
  # part of the corpus".
  #
  # Retirement says nothing on its own about the file, and the two entries below are
  # deliberately treated differently. who_hypertension_2021 keeps its copy in data/raw/
  # and stays indexed: the document is sound, only its URL died. The file for
  # icmr_amr_treatment_2022 is deleted, because the document is empty of clinical
  # content -- and because a file left in data/raw/ is picked up by the next manifest
  # build and re-indexed regardless of this flag.
  # ---------------------------------------------------------------------------

  - document_id: who_hypertension_2021
    title: WHO guideline for the pharmacological treatment of hypertension in adults
    source_url: https://iris.who.int/bitstream/handle/10665/344424/9789240033986-eng.pdf?sequence=1&isAllowed=y
    source_organization: WHO
    document_type: guideline
    publication_date: null
    version_or_revision: null
    local_filename: who_hypertension_2021.pdf
    retired: true
    retired_reason: >-
      The WHO IRIS URL no longer serves the PDF. As of 2026-08-13 it returns HTTP 200
      with a 432-byte HTML consent interstitial (magic bytes '<!DOC'), so a download
      cannot succeed. The copy in data/raw/ was fetched during Phase 1, when the URL
      still resolved to the document.
    license_or_usage_note: >-
      NOT VERIFIED. The licence statement could not be re-read from the source: the
      IRIS URL now returns a consent page rather than the PDF, and Phase 2 has no PDF
      parser with which to read the terms off the document itself. WHO IRIS titles are
      generally issued under CC BY-NC-SA 3.0 IGO, but that has not been confirmed for
      this document and must not be treated as established.
    notes: >-
      Title as recorded in Phase 1 and not independently re-verified in Phase 2, for
      the same reason the licence could not be. Flagged for re-check when a PDF parser
      lands in Phase 3.

  - document_id: icmr_amr_treatment_2022
    title: Treatment Guidelines for Antimicrobial Use in Common Syndromes
    source_url: https://www.icmr.gov.in/icmrobject/custom_data/pdf/resource-guidelines/treatment_amr_2022.pdf
    source_organization: ICMR
    document_type: guideline
    publication_date: null
    version_or_revision: "2022"
    local_filename: icmr_amr_treatment_2022.pdf
    retired: true
    retired_reason: >-
      The URL serves a one-page QR-code landing page, not the guidelines. Phase 3B
      parsed it and recovered 110 characters -- a title, a subtitle, and "Please scan
      above QR Code to get the link" -- which chunked to a single chunk of no
      clinical value. It passed every Phase 3A check (HTTP 200, %PDF- magic, 434 KB,
      sha256 verified) because not one of those checks could read the document.
      Replaced by icmr_diagnosis_management_cros, which is the guidance ICMR's own
      listing points the QR code at.
    license_or_usage_note: >-
      Material featured on this Website may be reproduced free of charge. However, the
      material has to be reproduced accurately and not to be used in a derogatory
      manner or in a misleading context. Wherever the material is being published or
      issued to others, the source must be prominently acknowledged. However, the
      permission to reproduce this material shall not extend to any material which is
      identified as being copyright of a third party. Authorization to reproduce such
      material must be obtained from the departments/copyright holders concerned.
      (https://www.icmr.gov.in/copyright-policy)
    notes: >-
      The 2019 edition of these treatment guidelines is not in the corpus either;
      see data/raw/SOURCES.md for why two live editions of the same treatment
      guidance is a retrieval hazard rather than a feature.
