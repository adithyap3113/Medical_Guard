  # ---------------------------------------------------------------------------
  # ICMR -- Indian Council of Medical Research.
  #
  # The one publisher in this corpus that states reuse terms in the affirmative, at
  # https://www.icmr.gov.in/copyright-policy, quoted verbatim below. It is also the
  # only non-US publisher here, which is the point: a corpus of exclusively US federal
  # guidance encodes US practice as though it were the whole of medicine.
  #
  # Titles are taken from ICMR's own guidelines listing page. That listing prefixes
  # each entry with its year ("2022- Guidance on Diagnosis & Management of Carbapenem
  # Resistant Gram-negative Infections"); the prefix is a listing convention rather
  # than part of the
  # title, so it is dropped here and the exact listing text is recorded in
  # data/raw/SOURCES.md for anyone who wants to check.
  #
  # publication_date is null for all three: the listing states a year only.
  # ---------------------------------------------------------------------------

